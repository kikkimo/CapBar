name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and package (macOS 15, Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          test "$GITHUB_REF_NAME" = "$expected"
          git show-ref --verify refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -f "docs/releases/$GITHUB_REF_NAME.md"

      - name: Run checks and build installer
        run: ./scripts/package-installer.sh

      - name: Verify installer
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          package="dist/CapBar-$version.pkg"
          test -s "$package"
          test "$(lipo -archs dist/CapBar.app/Contents/MacOS/CapBar)" = arm64
          codesign --verify --deep --strict dist/CapBar.app
          pkgutil --payload-files "$package" | grep -q 'CapBar.app/Contents/MacOS/CapBar'

      - name: Write release checksum
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd dist
          shasum -a 256 CapBar-*.pkg > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Keep tag build assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: capbar-${{ github.ref_name }}
          path: |
            dist/CapBar-*.pkg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: capbar-${{ github.ref_name }}
          path: release-assets

      - name: Verify checksum
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/CapBar-*.pkg release-assets/SHA256SUMS \
            --verify-tag \
            --title "CapBar ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
