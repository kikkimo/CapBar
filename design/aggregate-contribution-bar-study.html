<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CapBar · 总走势分摊横条视觉稿</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    body { margin: 0; background: #e9ebef; color: #1e242b; }
    .page { width: 1040px; min-height: 574px; padding: 25px 30px 30px; margin: auto; }
    .page-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 18px; }
    .page-head h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
    .page-head p { margin: 0; font-size: 11px; color: #78818c; }
    .variants { display: flex; gap: 22px; }
    .variant { width: 479px; padding: 12px 15px 16px; border: 1px solid #d4d9e0; border-radius: 15px; background: #f8f9fb; box-shadow: 0 12px 26px #1c27320c; }
    .variant.dark { color: #f0f2f4; background: #24272b; border-color: #45484f; box-shadow: 0 12px 28px #10131730; }
    .variant-title { display: flex; justify-content: space-between; align-items: center; padding: 4px 1px 11px; border-bottom: 1px solid #e1e4e8; }
    .dark .variant-title { border-color: #3b3e44; }
    .variant-title strong { font-size: 12px; font-weight: 700; }
    .variant-title span { font-size: 10px; color: #8b929b; }
    .chart-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 1px 0; }
    .chart-head h2 { margin: 0; font-size: 13px; font-weight: 700; }
    .chart-head p { margin: 4px 0 0; font-size: 10px; color: #858d97; }
    .chart-head b { font-size: 17px; letter-spacing: -.03em; color: #d45138; }
    .chart { height: 93px; margin-top: 7px; }
    .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .grid { stroke: #dfe3e8; stroke-width: 1; }
    .dark .grid { stroke: #42464c; }
    .axis { fill: #929aa4; font-size: 8px; font-weight: 600; }
    .line { fill: none; stroke: url(#line-gradient); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .detail { margin: 7px 8px 0 26px; padding: 12px 13px 13px; border: 1px solid #d9dee5; border-radius: 11px; background: #fff; box-shadow: 0 8px 19px #18202b14; }
    .dark .detail { background: #1d1f22; border-color: #3f4349; box-shadow: 0 8px 19px #0b0d0f3d; }
    .moment { font-size: 11px; font-weight: 600; color: #7b8490; }
    .dark .moment { color: #a7adb6; }
    .summary { display: flex; justify-content: space-between; align-items: baseline; margin-top: 5px; }
    .summary span { font-size: 12px; font-weight: 600; }
    .summary strong { font-size: 19px; font-weight: 750; color: #cf4c35; font-variant-numeric: tabular-nums; }
    .basis { margin-top: 1px; font-size: 10px; color: #8b929b; }
    .section-head { display: flex; justify-content: space-between; padding: 8px 0 7px; margin-top: 9px; border-top: 1px solid #e6e9ed; font-size: 10px; font-weight: 650; color: #78818b; }
    .dark .section-head { border-color: #36393e; color: #a9b0b8; }
    .account-row { display: grid; grid-template-columns: 180px minmax(0, 1fr) 52px; align-items: center; column-gap: 10px; height: 26px; }
    .account-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; font-weight: 570; }
    .bar { height: 7px; width: 100%; border-radius: 5px; overflow: hidden; background: #e8ebef; }
    .dark .bar { background: #3d4146; }
    .bar-fill { height: 100%; border-radius: 5px; background-repeat: no-repeat; }
    .percent { text-align: right; font-size: 11px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .note { margin: 16px 2px 0; color: #747d88; font-size: 11px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-head">
      <h1>总走势 · 账号列表行内横条</h1>
      <p>同一刻度：0% = 空条，20% = 满格；数值保持实际百分比</p>
    </div>
    <div class="variants">
      <section class="variant light">
        <div class="variant-title"><strong>CapBar · 浅色</strong><span>悬停时在曲线下方展开</span></div>
        <div class="chart-head"><div><h2>Claude 用量合计</h2><p>6 个账号 · 以首账号 Team Premium 为基准</p></div><b>58%</b></div>
        <div class="chart"></div>
        <div class="detail"></div>
      </section>
      <section class="variant dark">
        <div class="variant-title"><strong>CapBar · 深色</strong><span>悬停时在曲线下方展开</span></div>
        <div class="chart-head"><div><h2>Claude 用量合计</h2><p>6 个账号 · 以首账号 Team Premium 为基准</p></div><b>58%</b></div>
        <div class="chart"></div>
        <div class="detail"></div>
      </section>
    </div>
    <div class="note">演示值为匿名示例：3% + 5% + 0% + 12% + 18% + 20% = 58%。横条只表示各账号的等效用量，超过 20% 时满格但数值仍显示真实值。</div>
  </div>
  <script>
    const accounts = [
      ["alex.team@example.com", 3], ["sam.team@example.com", 5],
      ["lee.team@example.com", 0], ["pat.team@example.com", 12],
      ["kim.team@example.com", 18], ["taylor.team@example.com", 20]
    ];
    function turbo(t) {
      const x = 0.14 + Math.max(0, Math.min(1, t)) * 0.70;
      const r = 0.13572138 + 4.61539260*x - 42.66032258*x**2 + 132.13108234*x**3 - 152.94239396*x**4 + 59.28637943*x**5;
      const g = 0.09140261 + 2.19418839*x + 4.84296658*x**2 - 14.18503333*x**3 + 4.27729857*x**4 + 2.82956604*x**5;
      const b = 0.10667330 + 12.64194608*x - 60.58204836*x**2 + 110.36276771*x**3 - 89.90310912*x**4 + 27.34824973*x**5;
      return `rgb(${[r,g,b].map(v => Math.round((Math.max(0, Math.min(1, v)) * .82 + .18 * .47) * 255)).join(',')})`;
    }
    const scale = `linear-gradient(90deg, ${Array.from({length: 21}, (_, i) => `${turbo(i/20)} ${i*5}%`).join(',')})`;
    const plot = `<svg viewBox="0 0 440 93" aria-hidden="true"><defs><linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#357ce9"/><stop offset=".5" stop-color="#21b6b4"/><stop offset=".78" stop-color="#f4a533"/><stop offset="1" stop-color="#d45138"/></linearGradient></defs><line class="grid" x1="27" x2="435" y1="15" y2="15"/><line class="grid" x1="27" x2="435" y1="45" y2="45"/><line class="grid" x1="27" x2="435" y1="75" y2="75"/><text class="axis" x="1" y="18">60%</text><text class="axis" x="1" y="48">30%</text><text class="axis" x="7" y="78">0%</text><path class="line" d="M27 71 C67 70 86 63 118 66 S170 60 197 56 S238 58 260 48 S296 50 318 37 S365 34 386 26 S420 18 435 15"/><text class="axis" x="28" y="91">24</text><text class="axis" x="151" y="91">26</text><text class="axis" x="278" y="91">28</text><text class="axis" x="418" y="91">30</text></svg>`;
    document.querySelectorAll('.variant').forEach(variant => {
      variant.querySelector('.chart').innerHTML = plot;
      variant.querySelector('.detail').innerHTML = `<div class="moment">9月30日 10:00 · 本地时间</div><div class="summary"><span>这 2 小时合计用量</span><strong>58%</strong></div><div class="basis">Team Premium 等效 · 覆盖 6 个账号</div><div class="section-head"><span>账号列表</span><span>估算等效使用量</span></div>${accounts.map(([name, value]) => `<div class="account-row"><span class="account-name">${name}</span><div class="bar"><div class="bar-fill" style="width:${Math.min(100, value / 20 * 100)}%"></div></div><span class="percent" style="color:${turbo(value/20)}">${value}%</span></div>`).join('')}`;
      variant.querySelectorAll('.bar').forEach(bar => {
        const fill = bar.querySelector('.bar-fill');
        fill.style.backgroundImage = scale;
        fill.style.backgroundSize = `${bar.clientWidth}px 100%`;
      });
    });
  </script>
</body>
</html>
